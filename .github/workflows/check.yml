name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Rules: eslint-plugins/skills.mjs (docs/authoring.md#linting)
      - name: Lint skills
        run: pnpm lint

      # Every skill has its docs page; generated lists, catalog, plugin manifest and
      # CONTRIBUTING.md are up to date (docs/authoring.md#adding-a-skill).
      # Runs even when lint fails, so one push reports both.
      - name: Check skill docs
        if: ${{ !cancelled() }}
        run: node scripts/build-docs.mjs --check
